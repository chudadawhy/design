<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EQQUALBERRY · Design Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #f7f6f3;
      --surface:   #ffffff;
      --line:      #e9e7e2;
      --ink:       #111111;
      --ink-mid:   #6b6862;
      --ink-soft:  #a8a49c;
    }

    body {
      font-family: 'Helvetica Neue', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      padding: 34px 48px 26px;
      border-bottom: 1px solid var(--line);
    }

    .brandline {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
    }
    .brandline .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ink);
    }
    .brandline span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    header h1 {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--ink);
    }

    header p {
      margin-top: 9px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-mid);
    }
    header p code {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
      color: var(--ink);
    }

    /* ── STATS ── */
    .stats {
      display: flex;
      gap: 32px;
      padding: 14px 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .stats span {
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(247,246,243,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .search-box {
      flex: 1;
      max-width: 280px;
      min-width: 180px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 22px;
      padding: 9px 16px;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .search-box:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(17,17,17,0.05);
    }
    .search-box::placeholder { color: var(--ink-soft); }

    .filter-btns { display: flex; gap: 5px; flex-wrap: wrap; }

    .filter-btn {
      padding: 7px 15px;
      border-radius: 22px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink-mid);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
    .filter-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .refresh-btn {
      margin-left: auto;
      padding: 8px 15px;
      border-radius: 22px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink-mid);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .refresh-btn:hover { border-color: var(--ink); color: var(--ink); }

    /* ── MAIN ── */
    .main { padding: 34px 48px 64px; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-bottom: 16px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(246px, 1fr));
      gap: 16px;
      margin-bottom: 44px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 20px 18px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.18s;
    }
    .card:hover {
      border-color: #dcd9d2;
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(60,55,45,0.10);
    }
    .card:hover::before { opacity: 1; }

    .card-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .card-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 5px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding-right: 52px;
    }

    .card-meta {
      font-size: 11px;
      color: var(--ink-soft);
      letter-spacing: 0.02em;
    }

    .card-tag {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    /* ── STATES ── */
    .loading, .empty {
      text-align: center;
      padding: 72px 20px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid var(--line);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 카테고리별 색상 (라이트 톤) ── */
    /* .cat-*  = 아이콘 타일 (연한 배경 + 진한 컬러)
       .tag-*  = 우측 상단 칩
       card 의 color 값이 hover 시 상단 3px 액센트 라인 컬러로 쓰임 */
    .cat-trend     { background: #E7F6EC; color: #147A45; }
    .cat-instagram { background: #FBE9F2; color: #C2185B; }
    .cat-tiktok    { background: #FFE9ED; color: #E0113F; }
    .cat-benchmark { background: #E8F0FE; color: #1553B8; }
    .cat-other     { background: #F2F0EC; color: #6B6862; }

    .tag-trend     { background: #E7F6EC; color: #147A45; }
    .tag-instagram { background: #FBE9F2; color: #C2185B; }
    .tag-tiktok    { background: #FFE9ED; color: #E0113F; }
    .tag-benchmark { background: #E8F0FE; color: #1553B8; }
    .tag-other     { background: #F2F0EC; color: #6B6862; }

    .card.accent-trend     { color: #21A35B; }
    .card.accent-instagram { color: #E1306C; }
    .card.accent-tiktok    { color: #FE2C55; }
    .card.accent-benchmark { color: #2D5BE3; }
    .card.accent-other     { color: #A8A49C; }

    @media (max-width: 640px) {
      header { padding: 26px 20px 20px; }
      header h1 { font-size: 22px; }
      .stats, .toolbar { padding-left: 20px; padding-right: 20px; }
      .stats { gap: 18px; }
      .main { padding: 24px 20px 48px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brandline"><div class="dot"></div><span>EQQUALBERRY · Design</span></div>
  <h1>Design Hub</h1>
  <p><code>chudadawhy/design</code> 저장소에 HTML 파일을 추가하면 이 목록에 자동으로 나타납니다.</p>
</header>

<div class="stats" id="stats">
  <div>Pages <span id="total-count">—</span></div>
  <div>Updated <span id="last-updated">—</span></div>
</div>

<div class="toolbar">
  <input class="search-box" type="text" placeholder="파일 이름 검색" id="search" />
  <div class="filter-btns">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="trend">트렌드</button>
    <button class="filter-btn" data-filter="instagram">인스타그램</button>
    <button class="filter-btn" data-filter="tiktok">틱톡</button>
    <button class="filter-btn" data-filter="benchmark">벤치마킹</button>
    <button class="filter-btn" data-filter="other">기타</button>
  </div>
  <button class="refresh-btn" onclick="loadFiles()">↻ 새로고침</button>
</div>

<div class="main" id="main">
  <div class="loading">
    <div class="spinner"></div><br>파일 목록 불러오는 중...
  </div>
</div>

<script>
  const OWNER = 'chudadawhy';
  const REPO = 'design';
  const BRANCH = 'main'; // main 또는 master

  let allFiles = [];
  let activeFilter = 'all';
  let searchQuery = '';

  const categoryConfig = {
    trend:     { icon: '📊', keywords: ['trend', '트렌드'], color: 'cat-trend', tag: 'tag-trend', label: '트렌드' },
    tiktok:    { icon: '🎵', keywords: ['tiktok', 'tik_tok', '틱톡'], color: 'cat-tiktok', tag: 'tag-tiktok', label: '틱톡' },
    instagram: { icon: '📱', keywords: ['instagram', 'insta', '인스타', 'calendar', 'plan'], color: 'cat-instagram', tag: 'tag-instagram', label: '인스타그램' },
    benchmark: { icon: '🔍', keywords: ['benchmark', '벤치', 'brand', 'competitor'], color: 'cat-benchmark', tag: 'tag-benchmark', label: '벤치마킹' },
    other:     { icon: '📄', keywords: [], color: 'cat-other', tag: 'tag-other', label: '기타' },
  };

  function detectCategory(filename) {
    const lower = filename.toLowerCase();
    for (const [key, cfg] of Object.entries(categoryConfig)) {
      if (key === 'other') continue;
      if (cfg.keywords.some(k => lower.includes(k))) return key;
    }
    return 'other';
  }

  async function loadFiles() {
    document.getElementById('main').innerHTML = `
      <div class="loading"><div class="spinner"></div><br>파일 목록 불러오는 중...</div>`;

    try {
      // 재귀적으로 모든 HTML 파일 가져오기
      const files = await fetchAllFiles('');
      allFiles = files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');

      document.getElementById('total-count').textContent = allFiles.length;
      document.getElementById('last-updated').textContent = new Date().toLocaleString('ko-KR');

      renderFiles();
    } catch (e) {
      document.getElementById('main').innerHTML = `
        <div class="empty">
          ⚠️ 파일을 불러올 수 없습니다.<br>
          <small style="font-size:11px;margin-top:8px;display:block;">저장소가 Public인지 확인해 주세요.</small>
        </div>`;
    }
  }

  async function fetchAllFiles(path) {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
    if (!res.ok) throw new Error('API error');
    const items = await res.json();

    let files = [];
    for (const item of items) {
      if (item.type === 'file' && item.name.endsWith('.html')) {
        files.push({ ...item, category: detectCategory(item.name) });
      } else if (item.type === 'dir') {
        const sub = await fetchAllFiles(item.path);
        files = files.concat(sub);
      }
    }
    return files;
  }

  function renderFiles() {
    const filtered = allFiles.filter(f => {
      const matchFilter = activeFilter === 'all' || f.category === activeFilter;
      const matchSearch = f.name.toLowerCase().includes(searchQuery.toLowerCase());
      return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
      document.getElementById('main').innerHTML = `<div class="empty">조건에 맞는 파일이 없습니다.</div>`;
      return;
    }

    // 카테고리별 그룹
    const groups = {};
    filtered.forEach(f => {
      if (!groups[f.category]) groups[f.category] = [];
      groups[f.category].push(f);
    });

    let html = '';
    const order = activeFilter === 'all'
      ? ['trend', 'instagram', 'tiktok', 'benchmark', 'other']
      : [activeFilter];

    order.forEach(cat => {
      if (!groups[cat] || groups[cat].length === 0) return;
      const cfg = categoryConfig[cat];
      html += `<div class="section-title">${cfg.label}</div><div class="grid">`;
      groups[cat].forEach(f => {
        const pageUrl = `https://${OWNER}.github.io/${REPO}/${f.path}`;
        const displayName = f.name.replace('.html', '').replace(/[-_]/g, ' ');
        const folder = f.path.includes('/') ? f.path.split('/').slice(0, -1).join('/') : '';
        html += `
          <a class="card accent-${cat}" href="${pageUrl}" target="_blank">
            <div class="card-icon ${cfg.color}">${cfg.icon}</div>
            <div class="card-name">${displayName}</div>
            <div class="card-meta">${folder || '루트'}</div>
            <span class="card-tag ${cfg.tag}">${cfg.label}</span>
          </a>`;
      });
      html += '</div>';
    });

    document.getElementById('main').innerHTML = html;
  }

  // 검색
  document.getElementById('search').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderFiles();
  });

  // 필터
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderFiles();
    });
  });

  loadFiles();
</script>

</body>
</html>
