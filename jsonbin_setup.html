<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQB — 틱톡 캘린더 JSONBin 발급</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #f8f8f6; color: #111;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .box {
    background: #fff; border: 2px solid #111; border-radius: 12px;
    padding: 32px 36px; width: 560px; max-width: 100%;
  }
  h1 { font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  p { font-size: 12px; line-height: 1.7; color: #555; margin-bottom: 16px; }
  .warn {
    background: #FFF8E1; border-left: 3px solid #FFD600;
    padding: 10px 12px; font-size: 11px; line-height: 1.6; color: #7a5c00;
    border-radius: 4px; margin-bottom: 18px;
  }
  button {
    background: #111; color: #fff; border: none; border-radius: 6px;
    padding: 11px 22px; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  button:hover { background: #333; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  #out {
    display: none; margin-top: 20px; padding: 16px;
    background: #F1F8E9; border: 1.5px solid #9CCC65; border-radius: 8px;
  }
  #out.err { background: #FFEBEE; border-color: #E57373; }
  #out h2 { font-size: 12px; margin-bottom: 10px; }
  code {
    display: block; background: #fff; border: 1px solid #ddd; border-radius: 5px;
    padding: 10px 12px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em; word-break: break-all; margin-bottom: 8px;
  }
  .hint { font-size: 11px; color: #666; line-height: 1.6; }
</style>
</head>
<body>
<div class="box">
  <h1>틱톡 캘린더 — JSONBin 발급</h1>
  <p>아래 버튼을 누르면 <strong>틱톡 콘텐츠 캘린더 전용</strong> JSONBin이 새로 생성됩니다.
  인스타그램 캘린더 데이터와는 완전히 분리됩니다.</p>

  <div class="warn">
    ⚠️ <strong>한 번만 누르세요.</strong> 여러 번 누르면 쓸모없는 Bin이 계속 생성됩니다.<br>
    발급된 Bin ID를 복사해서 알려주시면 캘린더에 연결하고 이 페이지는 삭제합니다.
  </div>

  <button id="btn" onclick="createBin()">🎵 틱톡 전용 Bin 발급하기</button>

  <div id="out">
    <h2 id="out-title"></h2>
    <code id="out-id"></code>
    <div class="hint" id="out-hint"></div>
  </div>
</div>

<script>
const API_KEY = '$2a$10$.7SBk15RcVNdjKoMAr4XXe7DHPvfTxh/fzxLY4Z1QnuEesVacuDXi';

async function createBin() {
  const btn = document.getElementById('btn');
  const out = document.getElementById('out');
  const title = document.getElementById('out-title');
  const idEl = document.getElementById('out-id');
  const hint = document.getElementById('out-hint');

  btn.disabled = true;
  btn.textContent = '발급 중...';

  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY,
        'X-Bin-Name': 'EQB_TikTok_Content_Calendar_2026',
        'X-Bin-Private': 'true'
      },
      body: JSON.stringify({ cards: [] })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(JSON.stringify(json));

    const binId = json.metadata && json.metadata.id;
    out.className = '';
    out.style.display = 'block';
    title.textContent = '✅ 발급 완료 — 아래 Bin ID를 복사해서 알려주세요';
    idEl.textContent = binId;
    hint.textContent = '이 ID를 2026_tiktok_content_calendar.html 의 BIN_ID 값에 넣으면 저장 기능이 활성화됩니다.';
    btn.textContent = '발급 완료';
  } catch (e) {
    out.className = 'err';
    out.style.display = 'block';
    title.textContent = '⚠️ 발급 실패';
    idEl.textContent = String(e.message || e);
    hint.textContent = '이 메시지를 그대로 알려주세요. (jsonbin.io 무료 플랜 Bin 개수 제한일 수 있습니다)';
    btn.disabled = false;
    btn.textContent = '다시 시도';
  }
}
</script>
</body>
</html>
